<!doctype html>
<html lang="es" data-page="cmds" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050506" />
  <title>Comandos — VÉRSOVA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238b5cf6'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-family='Arial' font-size='34' font-weight='bold' fill='white'%3EV%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap stack">
    <div>
      <span class="label">⌘ Catálogo completo</span>
      <h2>Comandos</h2>
      <p class="lead">Todos los comandos de la plataforma, su categoría, alias y estado de implementación.</p>
    </div>

    <section class="grid grid-4">
      <div class="stat-tile"><span class="label">Total</span><b id="cmdCount">0</b><span class="tiny">Comandos</span></div>
      <div class="stat-tile"><span class="label">Implementados</span><b id="cmdImplemented">0</b><span class="tiny">Funcionando</span></div>
      <div class="stat-tile"><span class="label">Pendientes</span><b id="cmdPending">0</b><span class="tiny">En desarrollo</span></div>
      <div class="stat-tile"><span class="label">Categorías</span><b id="cmdCategories">0</b><span class="tiny">Secciones</span></div>
    </section>

    <section class="card">
      <div class="tabs" id="commandFilters"></div>
      <div class="grid grid-2" id="commandsList" style="margin-top:14px"></div>
    </section>

    <section class="card">
      <span class="label">Vista previa del menú</span>
      <pre class="mono small wrap-text" id="menuPreview" style="white-space:pre-wrap;margin:10px 0 0;color:var(--muted)">Cargando menú…</pre>
    </section>
  </main>

  <script src="shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
