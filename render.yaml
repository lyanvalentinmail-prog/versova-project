# Despliegue en Render (plan gratuito).
# PostgreSQL se aloja externamente en Neon; Render recibe la URL pooled en DATABASE_URL.
services:
  - type: web
    name: versova-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OWNER_NUMBERS
        sync: false
      - key: BOT_PHONE
        sync: false
