# Despliegue en Render (plan gratuito).
# PostgreSQL se aloja externamente en Neon; Render recibe la URL pooled en DATABASE_URL.
services:
  - type: web
    name: versova-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OWNER_NUMBERS
        value: "59896719709"
      - key: OWNER_EMAIL
        value: "lyanvalentinmail@gmail.com"
      - key: BOT_PHONE
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SECURE
        value: "false"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        value: "Versova <no-reply@versova.app>"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEMO_LOGIN
        value: "1"
